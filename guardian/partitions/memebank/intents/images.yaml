apiVersion: guardian/v1alpha1
kind: Intent
metadata:
  name: images
spec:
  intentType: standard
  targetPusher: k8s-main
  target:
    cluster: k8s-main
    namespace: memebank
  locked: false
  assets:
    - type: ImageBuild
      name: memebank-build
      version: auto
      properties:
        # Guardian's k8s pusher builds this from the MonoFS projection of the
        # repository. The image tag is the source commit, so a new commit is a
        # new image and a new release without a local checkout or pin update.
        buildSource: /.repos/github.com/radryc/memebank
        dockerfile: Dockerfile
        registry: registry.strata.local:5000
        repository: memebank
