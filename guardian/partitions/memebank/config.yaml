apiVersion: guardian/v1alpha1
kind: Partition
metadata:
  name: memebank
  labels:
    role: demo
    component: memebank
spec:
  defaults:
    observability:
      enabled: true
      autoInstrument: otelc
    probes:
      enabled: true
      interval: 30s
      timeout: 3s
      retries: 2
      httpPaths: ["/api/health"]
      tcpPorts: [8080]
      maxTargets: 20
      allowExternal: false
  deletionPolicy: orphan
  reconciliation:
    mode: auto
    interval: 1m
  labels:
    stack: k8s
    component: memebank
    topology: kubernetes
    managedBy: guardian
    owner: ryckor@example.com
    watcher: autodiscovery
