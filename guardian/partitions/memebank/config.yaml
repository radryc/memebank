apiVersion: guardian/v1alpha1
kind: Partition
metadata:
  name: memebank
  labels:
    role: demo
    component: memebank
spec:
  # Quota size class. Built-in classes ("small", "small-plus", "medium",
  # "medium-plus", "large", "xlarge") ship with predefined ingest/query/storage
  # envelopes, so a partition only needs to name the class it belongs to.
  # Start in observe mode, watch `doctor-ingest` quota logs, then switch to
  # `enforce` once the limits fit the workload.
  quota:
    profile: small
    enforcement: observe
  defaults:
    observability:
      enabled: true
      autoInstrument: otelc
    probes:
      enabled: true
      interval: 30s
      timeout: 3s
      retries: 2
      httpPaths: ["/api/health"]
      tcpPorts: [8080]
      maxTargets: 20
      allowExternal: false
  deletionPolicy: orphan
  reconciliation:
    mode: auto
    interval: 1m
  labels:
    stack: k8s
    component: memebank
    topology: kubernetes
    managedBy: guardian
    owner: radryc@example.com
    watcher: autodiscovery
